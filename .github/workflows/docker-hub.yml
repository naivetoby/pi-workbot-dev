name: Build and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DOCKER_BUILDKIT: '1'
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install pinned Dev Container CLI
        run: |
          version=$(node -p \
            'require("./package.json").devDependencies["@devcontainers/cli"]')
          npm install --global --ignore-scripts "@devcontainers/cli@$version"

      - name: Show available disk space
        run: df -h / /var/lib/docker

      # 两阶段构建共用 Docker daemon，以使用本地工具链镜像
      - name: Build and verify image
        run: bash scripts/build.sh pi-workbot-dev:check

      - name: Log in to Docker Hub
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified image
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          image="${DOCKERHUB_USERNAME}/pi-workbot-dev"
          docker tag pi-workbot-dev:check "$image:sha-${GITHUB_SHA}"
          docker tag pi-workbot-dev:check "$image:latest"
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:latest"
